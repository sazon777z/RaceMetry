<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Metallic Background Gradient -->
    <radialGradient id="bgGlowCar" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#162030"/>
      <stop offset="100%" stop-color="#080b10"/>
    </radialGradient>
    
    <!-- Bar 1 Gradient (Red/Orange Launch) -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Gold / Cyan Transition) -->
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffab00"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Bar 3 Gradient (Neon Lime Peak) -->
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Metallic Car Body Shading -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlowCar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlowCar)" stroke="#1e293b" stroke-width="4"/>

  <!-- Telemetry Performance Bars (Rising Slanted Parallelograms) -->
  <g>
    <!-- Bar 1 (Short) -->
    <path d="M 152 236 L 206 236 L 226 172 L 172 172 Z" fill="url(#barGrad1)"/>
    <!-- Bar 2 (Medium) -->
    <path d="M 230 236 L 294 236 L 322 138 L 258 138 Z" fill="url(#barGrad2)"/>
    <!-- Bar 3 (Tall - Peak Power) with Neon Glow -->
    <path d="M 318 236 L 392 236 L 428 92 L 354 92 Z" fill="url(#barGrad3)" filter="url(#softGlowCar)"/>
    <path d="M 318 236 L 392 236 L 428 92 L 354 92 Z" fill="url(#barGrad3)"/>
  </g>

  <!-- Speed & Exhaust Trails Behind Car -->
  <g stroke-linecap="round">
    <line x1="88" y1="236" x2="148" y2="236" stroke="#ff9100" stroke-width="4.5"/>
    <line x1="72" y1="262" x2="132" y2="262" stroke="#ff3d00" stroke-width="4"/>
    <line x1="96" y1="288" x2="138" y2="288" stroke="#00e676" stroke-width="3.5"/>
  </g>

  <!-- White Supercar Silhouette Profile (Facing Right) -->
  <g transform="translate(108, 192)">
    <!-- Shadow -->
    <ellipse cx="148" cy="116" rx="146" ry="12" fill="#000000" opacity="0.6" filter="blur(4px)"/>

    <!-- Main Body Shell -->
    <path d="M 18 84 
             C 12 78, 18 64, 30 60 
             L 60 56 
             C 82 46, 110 32, 142 32 
             L 194 36 
             C 228 48, 258 68, 282 82 
             L 294 88 
             C 298 94, 296 102, 288 106 
             L 272 108 
             C 264 108, 260 102, 256 94 
             C 248 76, 222 76, 214 94 
             L 208 108 
             L 96 108 
             C 92 98, 86 78, 70 78 
             C 54 78, 48 98, 44 108 
             L 24 106 
             C 16 102, 12 92, 18 84 Z" 
          fill="url(#carBodyGrad)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Side Air Scoops / Vent Insets -->
    <path d="M 134 68 L 176 68 L 166 94 L 126 94 Z" fill="#0f172a"/>
    <path d="M 124 94 L 164 94 L 158 102 L 120 102 Z" fill="#1e293b"/>

    <!-- Dark Tinted Windows & Roof Pillar -->
    <path d="M 94 54 L 140 40 L 192 44 L 174 62 L 98 62 Z" fill="#090d14" stroke="#1e293b" stroke-width="2"/>
    <!-- Windshield Reflection -->
    <path d="M 148 43 L 188 47 L 172 61 L 142 55 Z" fill="#00e5ff" opacity="0.3"/>

    <!-- Slim Cyan LED Headlight -->
    <polygon points="282,88 292,89 284,94 278,92" fill="#00ffcc" filter="drop-shadow(0 0 3px #00ffcc)"/>
    <!-- Slim Red LED Taillight -->
    <line x1="16" y1="80" x2="24" y2="82" stroke="#ff1744" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Rear Wheel -->
    <g transform="translate(57, 94)">
      <circle cx="0" cy="0" r="22" fill="#0b0f17" stroke="#475569" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b"/>
      <circle cx="0" cy="0" r="6" fill="#00e5ff"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(235, 94)">
      <circle cx="0" cy="0" r="22" fill="#0b0f17" stroke="#475569" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b"/>
      <circle cx="0" cy="0" r="6" fill="#00e5ff"/>
    </g>
  </g>

  <!-- Clean Bold Racing Title Below -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="256" y="386" font-size="34" font-weight="900" font-style="italic" letter-spacing="2">
      <tspan fill="#ffffff">RACEMETRY </tspan><tspan fill="#00ffcc">PRO</tspan>
    </text>
  </g>
</svg>

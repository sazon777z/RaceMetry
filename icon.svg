<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1e2838"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    
    <!-- Bar 1 Gradient (Orange / Red) -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Yellow / Gold) -->
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Bar 3 Gradient (Neon Lime Green) -->
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00dd55"/>
      <stop offset="100%" stop-color="#76ff03"/>
    </linearGradient>

    <!-- Car Body Metallic Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#263445" stroke-width="3"/>

  <!-- 3 Slanted Telemetry Bars (Exact Proportions from Reference) -->
  <g>
    <!-- Bar 1 (Short) -->
    <polygon points="160,230 224,230 252,148 188,148" fill="url(#bar1Grad)"/>
    <!-- Bar 2 (Medium) -->
    <polygon points="238,230 306,230 342,106 274,106" fill="url(#bar2Grad)"/>
    <!-- Bar 3 (Tall) with Soft Neon Glow -->
    <polygon points="320,230 396,230 440,64 364,64" fill="url(#bar3Grad)" filter="url(#softGlow)"/>
    <polygon points="320,230 396,230 440,64 364,64" fill="url(#bar3Grad)"/>
  </g>

  <!-- 3 Speed Streaks (Left) -->
  <g stroke-linecap="round">
    <path d="M 88 230 L 152 230" stroke="#ff7700" stroke-width="5"/>
    <path d="M 68 258 L 138 258" stroke="#ff4400" stroke-width="4.5"/>
    <path d="M 98 286 L 144 286" stroke="#00e676" stroke-width="4"/>
  </g>

  <!-- Supercar Group -->
  <g id="supercar">
    <!-- Ground Shadow -->
    <ellipse cx="270" cy="308" rx="150" ry="14" fill="#000000" opacity="0.65" filter="blur(6px)"/>

    <!-- Main Outer White Car Silhouette -->
    <!-- Front nose at right (395, 290), rear tail at left (135, 240) -->
    <path d="
      M 136 242
      C 134 235, 142 228, 150 228
      L 182 226
      C 204 212, 235 194, 276 194
      L 332 198
      C 362 216, 388 238, 412 262
      L 416 268
      C 420 274, 416 282, 404 288
      L 396 296
      C 392 300, 382 300, 376 296
      L 364 294
      C 358 274, 338 258, 314 258
      C 290 258, 270 274, 264 294
      L 204 294
      C 198 274, 178 258, 154 258
      C 130 258, 110 274, 104 294
      L 98 290
      C 94 286, 92 278, 96 270
      L 104 252
      C 106 244, 116 240, 124 240
      Z
    " fill="url(#carBody)" stroke="#090d14" stroke-width="4.5" stroke-linejoin="round" transform="translate(32, 10)"/>

    <!-- Car Interior / Dark Window Cutouts & Panels -->
    <g transform="translate(32, 10)">
      <!-- Main Window Cockpit Frame -->
      <!-- Windshield & Front Side Window -->
      <path d="M 232 208 L 290 208 L 282 228 L 218 228 Z" fill="#090e17" stroke="#1e293b" stroke-width="2"/>
      <path d="M 296 208 L 340 216 L 334 232 L 288 230 Z" fill="#090e17" stroke="#1e293b" stroke-width="2"/>
      <polygon points="344,218 368,244 336,244 336,234" fill="#090e17"/>

      <!-- Window Glass Reflection Line -->
      <line x1="240" y1="211" x2="330" y2="228" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

      <!-- Black Door / Quarter Intake (The iconic trapezoid scoop) -->
      <polygon points="214,244 268,244 254,272 198,272" fill="#090e17"/>
      <!-- Body Crease line above scoop -->
      <line x1="184" y1="238" x2="274" y2="238" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Front Headlight (Sharp Cyan Angle) -->
      <polygon points="396,268 412,274 402,280 392,274" fill="#00ffcc" filter="drop-shadow(0 0 3px #00ffcc)"/>

      <!-- Front Bumper Chin Intake -->
      <polygon points="394,286 406,286 400,294 386,294" fill="#090e17"/>

      <!-- Rear Taillight / Vent Accent -->
      <line x1="102" y1="256" x2="114" y2="258" stroke="#ff1744" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Wheels (Crisp Black Tires with Gray Rings & Center Hub) -->
    <!-- Rear Wheel -->
    <g transform="translate(186, 304)">
      <circle cx="0" cy="0" r="26" fill="#090d14" stroke="#475569" stroke-width="5"/>
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#090d14"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(346, 304)">
      <circle cx="0" cy="0" r="26" fill="#090d14" stroke="#475569" stroke-width="5"/>
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#090d14"/>
    </g>
  </g>

  <!-- Title Text Below: RACEMETRY PRO -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="256" y="394" font-size="36" font-weight="900" font-style="italic" letter-spacing="2">
      <tspan fill="#ffffff">RACEMETRY </tspan><tspan fill="#00ffcc">PRO</tspan>
    </text>
  </g>
</svg>
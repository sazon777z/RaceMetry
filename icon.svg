<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141d2c"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    
    <!-- Neon Gauge Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="60%" stop-color="#00ffcc"/>
      <stop offset="85%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>

    <!-- Red Needle Gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Semi-transparent Checkered Flag Background Pattern -->
    <pattern id="checkeredBg" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="rgba(255,255,255,0.038)"/>
      <rect x="18" width="18" height="18" fill="transparent"/>
      <rect y="18" width="18" height="18" fill="transparent"/>
      <rect x="18" y="18" width="18" height="18" fill="rgba(255,255,255,0.038)"/>
    </pattern>
  </defs>

  <!-- Dark Rounded App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" stroke="#1a2436" stroke-width="4"/>

  <!-- Semi-transparent Checkered Flag on Background -->
  <rect x="70" y="70" width="372" height="372" rx="60" fill="url(#checkeredBg)"/>

  <!-- Outer Dial Track Ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="rgba(0, 255, 204, 0.15)" stroke-width="2"/>

  <!-- Crisp Tachometer Dial Ticks -->
  <g stroke="rgba(255, 255, 255, 0.55)" stroke-width="3.5" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="76"/>
    <line x1="118" y1="118" x2="130" y2="130"/>
    <line x1="60" y1="256" x2="76" y2="256"/>
    <line x1="394" y1="118" x2="382" y2="130" stroke="#ff5252"/>
    <line x1="452" y1="256" x2="436" y2="256" stroke="#ff1744"/>
  </g>
  <g stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-linecap="round">
    <line x1="184" y1="84" x2="191" y2="98"/>
    <line x1="328" y1="84" x2="321" y2="98"/>
    <line x1="84" y1="184" x2="98" y2="191"/>
    <line x1="428" y1="184" x2="414" y2="191" stroke="rgba(255, 82, 82, 0.4)"/>
  </g>

  <!-- Speedometer Track (Background Arc) -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#101622" stroke-width="18"/>
  
  <!-- Active Neon Speed Arc (with Redline at Finish) -->
  <path d="M 136 366 A 158 158 0 1 1 376 366" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Start (Green) and Finish (Red) Accents -->
  <circle cx="136" cy="366" r="5" fill="#00e676"/>
  <circle cx="376" cy="366" r="6" fill="#ff1744" stroke="#ffffff" stroke-width="2"/>

  <!-- Short Bold Red Needle at Track (Pointing Down-Right to Finish) -->
  <path d="M 312 284 L 372 344 L 358 358 L 298 298 Z" fill="url(#needleGrad)" filter="url(#softGlow)"/>
  <polygon points="372,344 346,334 358,358" fill="#ffffff"/>

  <!-- Central Monogram "RM" (Clean Center without any hubs) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="252" y="254" font-size="118" font-weight="900" font-style="italic" letter-spacing="-1">
      <tspan fill="#ffffff">R</tspan><tspan fill="#00ffcc">M</tspan>
    </text>
  </g>

  <!-- Clean, Bold, Large "0-100" Badge Below -->
  <g transform="translate(176, 296)">
    <rect width="160" height="46" rx="23" fill="#0c121c" stroke="rgba(0, 255, 204, 0.7)" stroke-width="2.2"/>
    <text x="80" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#00ffcc" letter-spacing="3" text-anchor="middle">0-100</text>
  </g>
</svg>
